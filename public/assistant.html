<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AIアシスタント | Asteria Digital Bank</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/dashboard.html"><div class="brand-mark"><span>A</span></div><div>ASTERIA<small>DIGITAL BANK</small></div></a>
    <nav class="navlinks"><a href="/dashboard.html">ホーム</a><a href="/transfer.html">振込</a><a class="active" href="/assistant.html">AIアシスタント</a><span id="headerName"></span><span class="avatar" id="avatar"></span><button class="nav-button" id="logoutBtn">ログアウト</button></nav>
  </header>
  <main class="shell narrow-shell">
    <section class="hero"><div><div class="eyebrow">AIアシスタント</div><h1>Asteria Assistant</h1><p>残高照会や登録先メモの確認をお手伝いします。</p></div></section>
    <section class="card assistant-card">
      <div class="card-head"><h2>チャット</h2><span class="subtle">質問を入力してください</span></div>
      <div class="card-pad">
        <div class="chat chat-large" id="chat"><div class="bubble ai">こんにちは。残高照会や登録先メモの説明をお手伝いします。</div></div>
        <div class="suggestions"><button data-message="残高を教えて">残高を教えて</button><button data-message="Asteria Payのメモを教えて">Asteria Payのメモを教えて</button></div>
        <div class="chat-input"><input id="chatInput" placeholder="質問を入力してください"><button id="chatSend" class="btn btn-primary">送信</button></div>
      </div>
    </section>
  </main>
  <div class="toast" id="toast"></div>
  <script type="module" src="/assistant.js"></script>
</body>
</html>
