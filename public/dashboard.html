<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ホーム | Asteria Digital Bank</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/dashboard.html"><div class="brand-mark"><span>A</span></div><div>ASTERIA<small>DIGITAL BANK</small></div></a>
    <nav class="navlinks">
      <a class="active" href="/dashboard.html">ホーム</a>
      <a href="/transfer.html">振込</a>
      <a href="/assistant.html">AIアシスタント</a>
      <span id="headerName"></span>
      <span class="avatar" id="avatar"></span>
      <button class="nav-button" id="logoutBtn">ログアウト</button>
    </nav>
  </header>

  <main class="shell">
    <section class="hero">
      <div>
        <div class="eyebrow">パーソナルバンキング</div>
        <h1 id="greeting">こんにちは</h1>
        <p>口座と取引状況を確認できます。</p>
      </div>
    </section>

    <div class="dashboard-grid">
      <div class="stack">
        <section class="balance-card">
          <div class="label">総資産残高</div>
          <div class="amount" id="totalBalance">¥0</div>
          <div class="balance-meta"><div>今月の入金<strong>¥420,000</strong></div><div>今月の出金<strong>¥183,200</strong></div></div>
          <div class="account-list" id="accounts"></div>
        </section>

        <section class="card">
          <div class="card-head"><h2>最近の入出金</h2><span class="subtle">直近の取引</span></div>
          <div class="card-pad compact-top">
            <table class="activity">
              <thead><tr><th>日付</th><th>内容</th><th>状態</th><th class="right">金額</th></tr></thead>
              <tbody id="activity"></tbody>
            </table>
          </div>
        </section>
      </div>

      <aside class="stack">
        <section class="card action-card">
          <div class="card-head"><h2>クイックメニュー</h2><span class="subtle">よく使う操作</span></div>
          <div class="card-pad action-list">
            <a class="action-link" href="/transfer.html"><span class="action-icon">↗</span><div><strong>振込</strong><small>登録口座への振込を行います</small></div><span>›</span></a>
            <a class="action-link" href="/assistant.html"><span class="action-icon">AI</span><div><strong>AIアシスタント</strong><small>残高や登録先メモを確認します</small></div><span>›</span></a>
            <a class="action-link" href="/account.html?id=101"><span class="action-icon">▣</span><div><strong>口座詳細</strong><small>口座番号と取引履歴を確認します</small></div><span>›</span></a>
          </div>
        </section>

        <section class="card">
          <div class="card-head"><h2>本日の振込利用状況</h2><span class="subtle">1日上限</span></div>
          <div class="card-pad">
            <div class="limit-row"><div><div class="small">本日の振込額</div><strong id="usageText">¥0</strong></div><div class="small" id="limitText">/ ¥500,000</div></div>
            <div class="meter"><div id="usageMeter"></div></div>
          </div>
        </section>
      </aside>
    </div>
  </main>
  <script type="module" src="/dashboard.js"></script>
</body>
</html>
