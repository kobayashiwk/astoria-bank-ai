<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ログイン | Asteria Digital Bank</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="login-page">
  <main class="login-wrap">
    <div class="login-card">
      <section class="login-art">
        <div class="brand">
          <div class="brand-mark"><span>A</span></div>
          <div>ASTERIA<small>DIGITAL BANK</small></div>
        </div>
        <div class="login-copy">
          <div class="eyebrow light">パーソナルバンキング</div>
          <h1>毎日の銀行取引を、<br>もっとわかりやすく。</h1>
          <p>口座残高、振込、取引履歴をシンプルな画面で確認できます。</p>
        </div>
      </section>
      <section class="login-panel">
        <div class="eyebrow">ログイン</div>
        <h2>アカウントにログイン</h2>
        <p class="subtle">起動時にターミナルへ表示された6桁のアクセスコードを入力してください。</p>
        <form class="form login-form" id="loginForm">
          <div class="field">
            <label for="username">ユーザー</label>
            <select id="username">
              <option value="yamada">山田 太郎</option>
              <option value="sato">佐藤 美咲</option>
            </select>
          </div>
          <div class="field">
            <label for="accessCode">アクセスコード</label>
            <input id="accessCode" inputmode="numeric" autocomplete="one-time-code" placeholder="6桁のコード">
          </div>
          <button class="btn btn-primary btn-wide" type="submit">ログイン</button>
        </form>
      </section>
    </div>
  </main>
  <div class="toast" id="toast"></div>
  <script type="module" src="/login.js"></script>
</body>
</html>
