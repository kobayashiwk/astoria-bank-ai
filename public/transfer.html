<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>振込 | Asteria Digital Bank</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/dashboard.html"><div class="brand-mark"><span>A</span></div><div>ASTERIA<small>DIGITAL BANK</small></div></a>
    <nav class="navlinks"><a href="/dashboard.html">ホーム</a><a class="active" href="/transfer.html">振込</a><a href="/assistant.html">AIアシスタント</a><span id="headerName"></span><span class="avatar" id="avatar"></span><button class="nav-button" id="logoutBtn">ログアウト</button></nav>
  </header>
  <main class="shell narrow-shell">
    <section class="hero"><div><div class="eyebrow">振込</div><h1>振込内容を入力</h1><p>出金口座、振込先、金額を確認して振込を実行します。</p></div></section>
    <div class="two-column">
      <section class="card">
        <div class="card-head"><h2>振込情報</h2><span class="subtle">入力内容をご確認ください</span></div>
        <div class="card-pad">
          <form class="form" id="transferForm">
            <div class="field"><label for="fromAccount">出金口座</label><select id="fromAccount"></select></div>
            <div class="field"><label for="toAccount">振込先</label><select id="toAccount"><option value="201">佐藤 美咲 / ASTERIA BANK</option><option value="999">Asteria Pay / ASTERIA BANK</option></select></div>
            <div class="field"><label for="amount">振込金額</label><div class="money-input"><span>¥</span><input id="amount" type="number" min="1" max="500000" value="32000"></div><div class="small">1日の振込限度額：¥500,000</div></div>
            <div class="field"><label for="memo">メモ</label><input id="memo" value="立替精算"></div>
            <button class="btn btn-primary btn-wide" type="submit">振込を実行</button>
          </form>
        </div>
      </section>
      <aside class="stack">
        <section class="card"><div class="card-head"><h2>本日の振込利用状況</h2><span class="subtle">1日上限</span></div><div class="card-pad"><div class="limit-row"><div><div class="small">本日の振込額</div><strong id="usageText">¥0</strong></div><div class="small" id="limitText">/ ¥500,000</div></div><div class="meter"><div id="usageMeter"></div></div></div></section>
        <section class="card"><div class="card-pad"><h3 class="panel-title">振込時の確認事項</h3><ul class="note-list"><li>振込先と金額を確認してから実行してください。</li><li>振込完了後はホーム画面の取引履歴に反映されます。</li><li>1日の振込限度額は50万円です。</li></ul></div></section>
      </aside>
    </div>
  </main>
  <div class="toast" id="toast"></div>
  <script type="module" src="/transfer.js"></script>
</body>
</html>
